    allowed-clients: ${PAYMENT_ALLOWED_CLIENTS:}
  realm: yo-sales
  client-id: payment-ms
  client-secret: JfSiRh5NykLVHdnXUJKADguO3Uz73s4X
  kc-host: https://login-int.yosales.co

spring:
  cloud:
    compatibility-verifier:
      enabled: false
  datasource:
    url: jdbc:postgresql://54.38.35.221:5432/empire?currentSchema=payment_management
    username: admin
    password: eV03^a&T2W2E9r4xG0a^L&Yfc
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${PAYMENT_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: payment-ms
            client-secret: JfSiRh5NykLVHdnXUJKADguO3Uz73s4X
            authorization-grant-type: password
        provider:
          keycloak:
            token-uri: https://login-int.yosales.co/realms/yo-sales/protocol/openid-connect/token
