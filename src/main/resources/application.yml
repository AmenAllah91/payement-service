      resourceserver:
        jwt:
          jwk-set-uri: https://login-int.yosales.co/realms/yo-sales/protocol/openid-connect/certs
          issuer-uri: https://login-int.yosales.co/realms/yo-sales

jwt:
  auth:
    converter:
      resource-id: payment-ms
      principle-attribute: preferred_username


